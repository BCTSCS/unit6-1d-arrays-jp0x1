<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Basketball Teams - Basketball Data Analytics</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Basketball Analytics</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/teams">Teams</a></li>
                <li class="nav-item"><a class="nav-link" href="/arenas/compare">Arena Comparison</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">NBA Teams</h1>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="team : ${allTeams}">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0" th:text="${team.name}">Team Name</h5>
                </div>
                <div class="card-body">
                    <p class="card-text"><strong>Location:</strong> <span th:text="${team.location}">City</span></p>
                    <p class="card-text"><strong>Capacity:</strong> <span th:text="${team.capacity}">20,000</span></p>
                    <p class="card-text"><strong>Championships:</strong> <span th:text="${team.num_championships}">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- If no teams are found -->
    <div class="alert alert-info mt-4" th:if="${#lists.isEmpty(allTeams)}">
        No teams found in the database.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
