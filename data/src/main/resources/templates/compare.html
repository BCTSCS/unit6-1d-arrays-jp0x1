<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Arenas - Basketball Data Analytics</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Basketball Analytics</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/teams">Teams</a></li>
                <li class="nav-item"><a class="nav-link active" href="/arenas">Arenas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">NBA Arenas</h1>

    <!-- Sorting Buttons -->
    <div class="mb-4">
        <a href="/arenas/mostCommon" class="btn btn-outline-secondary">Find Most Common Arena</a>
    </div>

    <!-- Filter by Capacity Form -->
    <div class="mb-4">
        <form action="/arenas/filterByCapacity" method="get" class="d-flex">
            <input type="number" name="capacity" class="form-control me-2" placeholder="Enter minimum capacity" required>
            <button type="submit" class="btn btn-outline-success">Filter by Capacity</button>
        </form>
    </div>

    <!-- Most Common Arena -->
    <div class="mb-4" th:if="${mostCommonArena}">
        <h3>Most Common Arena Location</h3>
        <p th:text="'The most common arena location is: ' + ${mostCommonArena}">Most Common Arena</p>
    </div>

    <!-- Filtered Teams -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="team : ${filteredTeams}">
            <div class="card h-100">
                <div class="card-header bg-secondary text-white">
                    <h5 class="card-title mb-0" th:text="${team.name}">Team Name</h5>
                </div>
                <div class="card-body">
                    <p class="card-text"><strong>Location:</strong> <span th:text="${team.location}">City</span></p>
                    <p class="card-text"><strong>Capacity:</strong> <span th:text="${team.capacity}">20,000</span></p>
                    <p class="card-text"><strong>Championships:</strong> <span th:text="${team.num_championships}">0</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
