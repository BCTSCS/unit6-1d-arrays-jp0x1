<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Basketball Data Analytics</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Basketball Analytics</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/teams">Teams</a></li>
                <li class="nav-item"><a class="nav-link" href="/arenas/compare">Arena Comparison</a></li>
            </ul>
            <form class="d-flex ms-auto" action="/search" method="get">
                <input class="form-control me-2" type="search" placeholder="Search teams..." name="query">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Team Championships Overview -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="m-0">Championship Distribution</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>Team</th>
                                <th>Location</th>
                                <th>Championships</th>
                            </tr>
                            </thead>
                            <tbody>
<tr th:each="team : ${allTeams}">
    <td>
        <a th:href="@{/teams/{name}(name=${team.name})}" th:text="${team.name}">Team Name</a>
    </td>
    <td th:text="${team.location}">0</td>
    <td>
        <div class="progress">
            <div class="progress-bar bg-success"
                 th:style="'width: ' + ${(team.num_championships * 5) < 100 ? (team.num_championships * 5) : 100} + '%'"
                 th:text="${team.num_championships > 0 ? team.num_championships : ''}">
            </div>
        </div>
    </td>
</tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
